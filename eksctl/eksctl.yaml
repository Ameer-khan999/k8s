#Simple cluster configuration
#eksctl create cluster --config-file=eksctl.yaml
#eksctl delete cluster --region=us-east-1 --name=roboshop
#aws eks update-kubeconfig --region us-east-1 --name roboshop
-------------------------------------------------------------------------------


apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: roboshop
  region: us-east-1
managedNodeGroups:
  - name: managed
    instanceTypes: ["t3.micro"]  # Free Tier eligible instance type
    desiredCapacity: 2           # Stays within 750 hours/month
    spot: true
