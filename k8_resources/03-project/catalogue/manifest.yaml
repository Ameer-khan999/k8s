apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-cm
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: catalogue
data:
  MONGO: "True"
  MONGO_URL: "mongodb://mongodb-service:27017/catalogue"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: catalogue
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: catalogue
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: catalogue
    spec:
      containers:
      - name: catalogue
        image: joindevops/catalogue:4.0.0
        ports:
        - containerPort: 8080
        envFrom:
        -  configMapRef:
             name: catalogue-cm
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    component: catalogue
spec:
  selector:
    project: roboshop
    env: dev
    component: catalogue
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
