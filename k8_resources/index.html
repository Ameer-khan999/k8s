<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStore | Enterprise E-Commerce Platform</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.5; }

        /* Navbar */
        header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1280px; margin: 0 auto; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
        .search-bar { flex: 1; max-width: 500px; margin: 0 2rem; position: relative; }
        .search-bar input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 1px solid var(--border); border-radius: 9999px; outline: none; background: var(--bg); font-size: 0.95rem; }
        .search-bar svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 18px; height: 18px; }
        .nav-actions { display: flex; align-items: center; gap: 1.5rem; }
        .cart-btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 9999px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: background 0.2s; }
        .cart-btn:hover { background: var(--primary-dark); }

        /* Layout */
        .main-layout { max-width: 1280px; margin: 2rem auto; padding: 0 2rem; display: grid; grid-template-columns: 260px 1fr; gap: 2rem; }
        
        /* Filters Sidebar */
        aside { background: var(--surface); padding: 1.5rem; border: 1px solid var(--border); border-radius: 12px; height: fit-content; }
        aside h3 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--text); }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group label { display: block; margin-bottom: 0.5rem; color: var(--text-light); font-size: 0.9rem; cursor: pointer; }
        .filter-group input[type="checkbox"] { margin-right: 0.5rem; accent-color: var(--primary); }
        .filter-group select { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }

        /* Product Grid */
        .catalog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
        .product-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .product-img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; }
        .product-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
        .product-category { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-light); font-weight: 700; margin-bottom: 0.25rem; }
        .product-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text); }
        .product-rating { display: flex; align-items: center; gap: 0.25rem; color: var(--accent); font-size: 0.85rem; margin-bottom: 0.75rem; }
        .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .product-price { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        .add-to-cart { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 0.75rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .add-to-cart:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Slide-over Cart Drawer */
        .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .drawer-overlay.open { opacity: 1; pointer-events: auto; }
        .cart-drawer { position: fixed; top: 0; right: 0; width: 400px; height: 100%; background: var(--surface); z-index: 1001; box-shadow: -10px 0 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .cart-drawer.open { transform: translateX(0); }
        .drawer-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .drawer-body { padding: 1.5rem; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .cart-item { display: flex; gap: 1rem; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
        .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-size: 0.9rem; font-weight: 600; }
        .cart-item-price { color: var(--text-light); font-size: 0.85rem; }
        .cart-item-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .cart-item-controls button { width: 24px; height: 24px; border: 1px solid var(--border); background: var(--bg); border-radius: 4px; cursor: pointer; }
        .drawer-footer { padding: 1.5rem; border-top: 1px solid var(--border); background: var(--bg); }
        .checkout-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
        .checkout-btn:hover { background: var(--primary-dark); }
        .close-drawer { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-light); }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            aside { display: none; }
            .cart-drawer { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
                LuxeStore
            </a>
            <div class="search-bar">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="searchInput" placeholder="Search premium items, apparel, electronics..." oninput="filterProducts()">
            </div>
            <div class="nav-actions">
                <button class="cart-btn" onclick="toggleCart()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Filters -->
        <aside>
            <h3>Filters</h3>
            <div class="filter-group">
                <label><input type="checkbox" value="all" checked onchange="filterCategory('all')"> All Categories</label>
                <label><input type="checkbox" value="Electronics" onchange="filterCategory('Electronics')"> Electronics</label>
                <label><input type="checkbox" value="Apparel" onchange="filterCategory('Apparel')"> Apparel</label>
                <label><input type="checkbox" value="Accessories" onchange="filterCategory('Accessories')"> Accessories</label>
            </div>
            <div class="filter-group">
                <h3>Sort By</h3>
                <select id="sortSelect" onchange="sortProducts()">
                    <option value="featured">Featured</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
        </aside>

        <!-- Catalog Area -->
        <main>
            <div class="catalog-header">
                <h1 id="categoryTitle" style="font-size: 1.5rem; font-weight: 700;">All Products</h1>
                <span style="color: var(--text-light); font-size: 0.9rem;" id="productCount">Showing items</span>
            </div>
            <div class="products-grid" id="productGrid">
                <!-- Dynamically populated via JS -->
            </div>
        </main>
    </div>

    <!-- Slide-over Cart Drawer -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h2>Your Shopping Cart</h2>
            <button class="close-drawer" onclick="toggleCart()">×</button>
        </div>
        <div class="drawer-body" id="cartItemsContainer">
            <p style="color: var(--text-light); text-align: center; margin-top: 2rem;">Your cart is empty.</p>
        </div>
        <div class="drawer-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 600;">
                <span>Subtotal:</span>
                <span id="cartSubtotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="alert('Proceeding to secure checkout gateway...')">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Pro Wireless Noise-Canceling Headphones", category: "Electronics", price: 299.99, rating: 4.8, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" },
            { id: 2, name: "Minimalist Chronograph Watch", category: "Accessories", price: 189.50, rating: 4.6, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=60" },
            { id: 3, name: "Performance Running Sneakers", category: "Apparel", price: 120.00, rating: 4.9, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500&auto=format&fit=crop&q=60" },
            { id: 4, name: "Ergonomic Mechanical Keyboard", category: "Electronics", price: 149.99, rating: 4.7, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&auto=format&fit=crop&q=60" },
            { id: 5, name: "Classic Leather Backpack", category: "Accessories", price: 210.00, rating: 4.5, image: "https://images.unsplash.com/photo-1545128485-c400e7702796?w=500&auto=format&fit=crop&q=60" },
            { id: 6, name: "Ultra HD Smart Action Camera", category: "Electronics", price: 349.00, rating: 4.8, image: "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = [];
        let activeCategory = 'all';

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            document.getElementById('productCount').innerText = `${items.length} items available`;
            
            if(items.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-light);">No products found.</p>`;
                return;
            }

            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}" class="product-img">
                    <div class="product-body">
                        <span class="product-category">${p.category}</span>
                        <h3 class="product-title">${p.name}</h3>
                        <div class="product-rating">★ ${p.rating}</div>
                        <div class="product-footer">
                            <span class="product-price">$${p.price.toFixed(2)}</span>
                            <button class="add-to-cart" onclick="addToCart(${p.id})">+ Add</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = products.filter(p => 
                (activeCategory === 'all' || p.category === activeCategory) &&
                p.name.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.getElementById('categoryTitle').innerText = cat === 'all' ? 'All Products' : cat;
            filterProducts();
        }

        function sortProducts() {
            const sortBy = document.getElementById('sortSelect').value;
            let currentItems = [...products];
            if(sortBy === 'low-high') currentItems.sort((a,b) => a.price - b.price);
            if(sortBy === 'high-low') currentItems.sort((a,b) => b.price - a.price);
            renderProducts(currentItems);
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            const existing = cart.find(c => c.id === id);
            if(existing) {
                existing.qty++;
            } else {
                cart.push({...item, qty: 1});
            }
            updateCartUI();
            toggleCart();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            const container = document.getElementById('cartItemsContainer');
            
            if(cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-light); text-align: center; margin-top: 2rem;">Your cart is empty.</p>`;
                document.getElementById('cartSubtotal').innerText = '$0.00';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">$${item.price.toFixed(2)} x ${item.qty}</div>
                        <div class="cart-item-controls">
                            <button onclick="adjustQty(${item.id}, -1)">-</button>
                            <span>${item.qty}</span>
                            <button onclick="adjustQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartSubtotal').innerText = `$${subtotal.toFixed(2)}`;
        }

        function adjustQty(id, change) {
            const item = cart.find(c => c.id === id);
            if(item) {
                item.qty += change;
                if(item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCartUI();
        }

        // Initialize grid
        renderProducts(products);
    </script>
</body>
</html>
