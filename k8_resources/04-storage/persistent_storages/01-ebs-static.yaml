apiVersion: v1
kind: PersistentVolume
metadata:
  name: ebs-static
  labels:
    project: roboshop
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-0c5fa97fb096f37a7
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-static
  labels:
    project: roboshop
spec:
  storageClassName: ""
  accessModes:
  - ReadWriteOnce
  volumeName: ebs-static
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pod
  labels:
    project: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: ebs-static
      mountPath: /usr/share/nginx/html
  volumes:
  - name: ebs-static
    persistentVolumeClaim:
      claimName: ebs-static
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1d
