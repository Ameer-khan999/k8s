apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-dynamic
  labels:
    project: roboshop
provisioner: ebs.csi.aws.com
reclaimPolicy: Delete    # if we keep Retain, volumes will not be deleted, if Recycle volumes will not be deleted but data should be.
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-dynamic
  labels:
    project: roboshop
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ebs-dynamic
  resources:
    requests:
      storage: 44Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-dynamic-pod
  labels:
    project: roboshop
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: ebs-dynamic
      mountPath: /usr/share/nginx
  volumes:
  - name: ebs-dynamic
    persistentVolumeClaim:
      claimName: ebs-dynamic
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1f
