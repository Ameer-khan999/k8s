apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment-demo
  labels:
    project: roboshop
    topic: deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      topic: deployment
  template:
    metadata:
      labels:
        project: roboshop
        topic: deployment
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
